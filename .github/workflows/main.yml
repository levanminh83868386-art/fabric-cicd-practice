name: Fabric Deployment

on:
  push:
    branches: 
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Fabric CLI
      run: |
        python -m pip install --upgrade pip
        pip install ms-fabric-cli     
    - name: Authenticate Fabric CLI
      run: |
        fab config set encryption_fallback_enabled true
        fab auth login \
          --user ${{ secrets.FABRIC_CLIENT_ID }} \
          --password ${{ secrets.FABRIC_CLIENT_SECRET }} \
          --tenant ${{ secrets.FABRIC_TENANT_ID }}

        fab acl set Minh-FabricCICD-TEST.Workspace -I 9242fe29-6d29-4961-a598-8e24d9ffbfb7 -R Admin
        
        # fab mkdir "Minh-FabricCICD-TEST.Workspace" -P capacityName=capacityvinhmai
        
        # Kiểm tra trạng thái đăng nhập
        fab auth status
    # - name: Create a new workspace
    #   run: |
    #     fab mkdir "Minh-FabricCICD-TEST.Workspace" --capacityName ${{ secrets.FABRIC_CAPACITY_NAME }}

          
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: List files
      run: ls -la
